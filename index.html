<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rapid Fire Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}
body{background:#0f0f1a;color:white;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:#151528;position:sticky;top:0;z-index:100}
h1{font-size:20px}
button{padding:6px 12px;border:none;border-radius:6px;background:#5865f2;color:white;cursor:pointer}
button:hover{opacity:.8}
.container{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
.card{background:#1c1c30;border-radius:12px;padding:10px;text-align:center;cursor:pointer;position:relative}
.card:hover{background:#25254a}
.card img{width:100%;height:100px;object-fit:cover;border-radius:8px}
.favorite{position:absolute;top:5px;right:5px;cursor:pointer;font-size:14px}
input{padding:6px;border-radius:6px;border:none;margin-right:10px}
.section{margin-top:30px}
.hidden{display:none}
.login-box{max-width:400px;margin:100px auto;background:#1c1c30;padding:20px;border-radius:12px}
.login-box input{width:100%;margin:5px 0;padding:8px}
footer{text-align:center;padding:20px;opacity:.6}
</style>
</head>

<body>

<header>
  <h1>Rapid Fire Games</h1>
  <div id="navButtons"></div>
</header>

<div class="container" id="mainContent"></div>

<footer>© 2026 Rapid Fire Games</footer>

<script>

/* ---------------- AUTH SYSTEM ---------------- */

function getUsers(){ return JSON.parse(localStorage.getItem("users")||"[]") }
function setUsers(u){ localStorage.setItem("users",JSON.stringify(u)) }
function getCurrent(){ return JSON.parse(localStorage.getItem("currentUser")) }
function setCurrent(u){ localStorage.setItem("currentUser",JSON.stringify(u)) }
function logout(){ localStorage.removeItem("currentUser"); location.reload() }

/* ---------------- LOGIN PAGE ---------------- */

function showLogin(){
document.getElementById("mainContent").innerHTML=`
<div class="login-box">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p style="margin-top:10px">No account? <a href="#" onclick="showRegister()">Register</a></p>
</div>`;
}

function showRegister(){
document.getElementById("mainContent").innerHTML=`
<div class="login-box">
<h2>Register</h2>
<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">Create Account</button>
<p style="margin-top:10px"><a href="#" onclick="showLogin()">Back to Login</a></p>
</div>`;
}

function register(){
let users=getUsers()
let user={
id:Date.now(),
username:username.value,
email:email.value,
password:password.value,
favorites:[],
recent:[],
stats:{played:0}
}
users.push(user)
setUsers(users)
setCurrent(user)
initApp()
}

function login(){
let users=getUsers()
let user=users.find(u=>u.email==email.value&&u.password==password.value)
if(user){setCurrent(user);initApp()}
else alert("Invalid login")
}

/* ---------------- GAMES ---------------- */

const games=[
{title:"Slope",url:"https://slopegame.gitlab.io/"},
{title:"Retro Bowl",url:"https://retrobowl.me/"},
{title:"1v1.lol",url:"https://1v1.lol/"},
{title:"Minecraft Classic",url:"https://classic.minecraft.net/"},
{title:"Geometry Dash",url:"https://gdcolon.com/gd/"}
]

function renderGames(filter=""){
let user=getCurrent()
let gridHTML=`<div class="section">
<input placeholder="Search..." oninput="renderGames(this.value)">
<button onclick="showFavorites()">Favorites</button>
<button onclick="showProfile()">Profile</button>
<button onclick="showAdmin()">Admin</button>
<button onclick="openAI()">AI</button>
</div><div class="grid">`

games.filter(g=>g.title.toLowerCase().includes(filter.toLowerCase()))
.forEach(g=>{
let fav=user.favorites.includes(g.title)?"★":"☆"
gridHTML+=`
<div class="card">
<div class="favorite" onclick="toggleFav('${g.title}')">${fav}</div>
<img src="https://via.placeholder.com/150">
<h3 onclick="openGame('${g.url}','${g.title}')">${g.title}</h3>
</div>`
})
gridHTML+=`</div>`
document.getElementById("mainContent").innerHTML=gridHTML
}

/* ---------------- GAME OPEN + FPS ---------------- */

function openGame(url,title){
let user=getCurrent()
user.stats.played++
user.recent.unshift(title)
if(user.recent.length>5) user.recent.pop()
updateUser(user)

let win=window.open("")
win.document.write(`
<html>
<head>
<title>${title}</title>
<style>
body{margin:0;background:black}
iframe{width:100%;height:100%;border:none}
#fps{position:fixed;top:10px;right:15px;color:lime;font-family:monospace}
</style>
</head>
<body>
<div id="fps">FPS: 0</div>
<iframe src="${url}"></iframe>
<script>
let last=performance.now(),frames=0
function loop(){
frames++
let now=performance.now()
if(now-last>=1000){
fps.innerText="FPS: "+frames
frames=0
last=now
}
requestAnimationFrame(loop)
}
loop()
<\/script>
</body>
</html>`)
}

/* ---------------- FAVORITES ---------------- */

function toggleFav(title){
let user=getCurrent()
if(user.favorites.includes(title))
user.favorites=user.favorites.filter(f=>f!=title)
else user.favorites.push(title)
updateUser(user)
renderGames()
}

function showFavorites(){
let user=getCurrent()
document.getElementById("mainContent").innerHTML=
"<h2>Favorites</h2><ul>"+user.favorites.map(f=>"<li>"+f+"</li>").join("")+"</ul><button onclick='renderGames()'>Back</button>"
}

/* ---------------- PROFILE ---------------- */

function showProfile(){
let user=getCurrent()
document.getElementById("mainContent").innerHTML=`
<h2>${user.username}</h2>
<p>Email: ${user.email}</p>
<p>Games Played: ${user.stats.played}</p>
<h3>Recently Played</h3>
<ul>${user.recent.map(r=>"<li>"+r+"</li>").join("")}</ul>
<button onclick="renderGames()">Back</button>`
}

/* ---------------- ADMIN ---------------- */

function showAdmin(){
let users=getUsers()
document.getElementById("mainContent").innerHTML=`
<h2>Admin Panel</h2>
<p>Total Users: ${users.length}</p>
<ul>${users.map(u=>"<li>"+u.username+"</li>").join("")}</ul>
<button onclick="renderGames()">Back</button>`
}

/* ---------------- AI ---------------- */

function openAI(){
window.open("https://goongle.vercel.app/ai","_blank")
}

/* ---------------- UPDATE USER ---------------- */

function updateUser(user){
let users=getUsers()
users=users.map(u=>u.id==user.id?user:u)
setUsers(users)
setCurrent(user)
}

/* ---------------- INIT ---------------- */

function initApp(){
let user=getCurrent()
document.getElementById("navButtons").innerHTML=
user?`<button onclick="logout()">Logout</button>`:""
renderGames()
}

if(getCurrent()) initApp()
else showLogin()

</script>

</body>
</html>
